<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bubble game</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
  
    <div class="main">
      <div class="panel">
        <div class="pside">
          <section class="highScorebox" aria-labelledby="high-score-title">
            <h2 id="high-score-title">High Score</h2>
            <div class="highScore" aria-label="High score">000</div>
          </section>
          <fieldset class="level">
            <legend>Level</legend>
            <label class="level-option" for="level-easy">
              <input id="level-easy" name="level" value="Easy" type="radio" checked>
              <span>Easy</span>
            </label>
            <label class="level-option" for="level-medium">
              <input id="level-medium" name="level" value="Medium" type="radio">
              <span>Medium</span>
            </label>
            <label class="level-option" for="level-hard">
              <input id="level-hard" name="level" value="Hard" type="radio">
              <span>Hard</span>
            </label>
          </fieldset>
          <fieldset class="level timer-options">
            <legend>Timer</legend>
            <label class="level-option" for="timer-30">
              <input id="timer-30" name="timerinput" value="30" type="radio">
              <span>30 sec</span>
            </label>
            <label class="level-option" for="timer-60">
              <input id="timer-60" name="timerinput" value="60" type="radio" >
              <span>60 sec</span>
            </label>
            <label class="level-option" for="timer-120">
              <input id="timer-120" name="timerinput" value="120" type="radio">
              <span>120 sec</span>
            </label>
          </fieldset>
        </div>
        <div class="ptop">
        <div class="startdiv"> <button id="startbtn">Start</button></div>

          <div class="elem">
            <h3>Hit:</h3>
            <div id="hitval" class="box">0</div>
          </div>
          <div class="elem">
            <h3>Timer:</h3>
            <div id="timerval" class="box"></div>
          </div>
          <div class="elem">
            <h3>Score:</h3>
            <div id="scoreval" class="box">0</div>
          </div>
        </div>
        <div class="pbtm">

        </div>
      </div>
    </div>
</body>
<script src="script.js"></script>
</html>
