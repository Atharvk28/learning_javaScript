<html lang="en">

<body>
  <h1 id="name">Atharv Kamble</h1>
  <button id="start">Start</button>
  <button id="end">End</button>

</body>
<script>
  // setTimeout(() => {

let timeout;
const start = function (){
  document.getElementById('name').innerHTML='Kamble'
  console.log('started')

}
 const namechange= function(){  timeout = setTimeout(start, 3000)}


  document.getElementById('start').addEventListener('click',namechange)


document.getElementById('end').addEventListener('click',function () {
  console.log('stopped')
  clearTimeout(timeout)
}
    )

</script>
